[buil-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bkam"
version = "0.1.0"
description = "Typed Python client for the Bank Al-Maghrib (BKAM) API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]
